name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the base path
        # Project sites live at /<repo>; a <user>.github.io repo lives at the root.
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV";
          else echo "NEXT_PUBLIC_BASE_PATH=/$repo" >> "$GITHUB_ENV"; fi
      - run: npm run build
        env:
          # Public by design: these ship in every visitor's browser bundle.
          # Data is protected by row-level security in supabase/schema.sql.
          NEXT_PUBLIC_SUPABASE_URL: https://jnocstylsvdmuoozvtze.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impub2NzdHlsc3ZkbXVvb3p2dHplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NDEwNDYsImV4cCI6MjExMDUxNzA0Nn0.DPI5BY-8eciKpB7mnPdXrqsT6f39BYCMFp2pQVgxVZA
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
